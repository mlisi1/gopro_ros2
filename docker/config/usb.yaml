# USB (wired) transport: power + control + webcam stream over the USB NCM interface.
/**:
  ros__parameters:
    transport: usb
    serial: ""                 # last 3+ digits; empty = auto-detect the NCM link / mDNS
    ble_sidechannel: false     # true: also BLE for push status, wake, AP/COHN/livestream control
    claim_control: true
    on_connect:
      sync_datetime: true
      load_preset: "video"     # preset id or group (video|photo|timelapse); "" = leave as is
      apply_settings: true
    status:
      poll_rate: 1.0
    keep_alive_period: 3.0
    stream:
      enabled: true
      # preview: 1080p HEVC live view that runs *alongside* SD recording (HERO13 over USB, verified).
      # webcam: choosable resolution/FOV (H.264) but the camera cannot record while it is active.
      mode: preview
      protocol: TS               # webcam only: TS | RTSP
      resolution: "1080p"        # webcam only
      fov: "Linear"              # webcam only
      port: 8554
      publish_raw: true
      publish_h264: true
      max_rate: 10.0
      scale: 0.5
      latency_offset: 0.69     # measured for the HERO13/USB *webcam*; measure preview: gopro-calibrate-sync --n 0 --stream-latency 20 --stream-mode preview
    camera_info_url: ""        # e.g. file:///home/robot/calib/gopro_1080p_linear.yaml
    media:
      download_dir: ~/gopro_media
      offload: "off"           # off | copy (SD + local copy) | move (local copy, then deleted from SD once verified)
      offload_min_free_gb: 5.0   # transfers wait if the local disk would drop below this
      offload_settle_s: 10.0     # camera idle this long first (it is still finishing the file)
    settings:                  # spec labels or option ids; unset = untouched
      video_resolution: "4K"
      frames_per_second: "30"
      hypersmooth: "Off"
      gps: "On"
      auto_power_down: "Never"
