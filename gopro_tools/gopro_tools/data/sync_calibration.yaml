# Default start-sync calibrations shipped with gopro_tools (format: gopro_tools/sync_calibration.py).
# Your own measurements (gopro-calibrate-sync) go to ~/.ros/gopro/sync_calibration.yaml and take
# precedence. An entry only applies to recordings with the same model, transport and frame rate.
calibrations:
  - model: HERO13 Black
    transport: usb
    fps: 29.97
    resolution: 5312x2988
    firmware: H24.01.02.04.00
    start_offset_s: -0.037
    uncertainty_s: 0.024
    sd_s: 0.007
    n: 10
    display_lag_s: 0.0
    settings:
      video_resolution: 5.3K
      frames_per_second: '30.0'
      video_lens: Linear
      hypersmooth: Low
      hindsight: 'Off'
    measured: '2026-10-13'
    note: >-
      Read by eye from an on-screen clock (pilot of gopro-calibrate-sync); display lag not
      subtracted, so the true offset is likely 10-30 ms later. Uncertainty = sqrt((2 sd)^2 + 20 ms^2).
