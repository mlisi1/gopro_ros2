# Default start-sync calibrations shipped with gopro_tools (format: gopro_tools/sync_calibration.py).
# Your own measurements (gopro-calibrate-sync) go to ~/.ros/gopro/sync_calibration.yaml and take
# precedence. An entry only applies to recordings with the same model, transport and frame rate.
calibrations:
  - model: HERO13 Black
    transport: usb
    fps: 29.97
    resolution: 5312x2988
    firmware: H24.01.02.04.00
    start_offset_s: -0.042
    uncertainty_s: 0.0225
    sd_s: 0.0052
    n: 9
    display_lag_s: 0.0
    settings:
      video_resolution: 5.3K
      frames_per_second: '30.0'
      video_lens: Linear
      hypersmooth: Low
      hindsight: 'Off'
    measured: '2026-10-13'
    note: >-
      gopro-calibrate-sync, 10 recordings, 1 outlier (late ack) excluded; median. An earlier
      by-eye reading of the same configuration gave -37 ms. Display lag not subtracted (true offset
      likely 10-30 ms later). Uncertainty = sqrt((2 sd)^2 + 20 ms^2).
